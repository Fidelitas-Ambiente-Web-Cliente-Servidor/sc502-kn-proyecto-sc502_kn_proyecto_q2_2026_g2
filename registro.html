<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - CarpoolMatch CR</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-simple-body">

    <header class="header">

        <div class="brand">

            <h1>CarpoolMatch CR</h1>

            <p>Viajes compartidos en Costa Rica</p>

        </div>

        <nav class="nav">

            <a href="index.html">Inicio</a>

            <a href="login.html">Iniciar sesión</a>

            <a href="registro.html" class="nav-btn">Registrarse</a>

        </nav>

    </header>

    <main class="login-simple">

        <section class="login-card registro-card">

            <h2>Crear cuenta</h2>

            <p>

                Regístrate para buscar viajes, publicar rutas y compartir transporte.

            </p>

            <form action="php/registro.php" method="POST" class="form">

                <label>Nombre completo</label>

                <input type="text" name="nombre" required>

                <label>Correo electrónico</label>

                <input type="email" name="correo" required>

                <label>Teléfono</label>

                <input type="tel" name="telefono" maxlength="8" required>

                <label>Tipo de usuario</label>

                <select name="tipoUsuario" required>

                    <option value="">Seleccione una opción</option>

                    <option value="Conductor">Conductor</option>

                    <option value="Pasajero">Pasajero</option>

                    <option value="Ambos">Ambos</option>

                </select>

                <label>Contraseña</label>

                <input type="password" name="contrasena" required>

                <label>Confirmar contraseña</label>

                <input type="password" name="confirmar" required>

                <button type="submit" class="btn btn-primary full">

                    Registrarse

                </button>

            </form>

            <p class="switch-text">

                ¿Ya tienes cuenta?

                <a href="login.html">

                    Inicia sesión aquí

                </a>

            </p>

        </section>

    </main>

</body>

</html>
