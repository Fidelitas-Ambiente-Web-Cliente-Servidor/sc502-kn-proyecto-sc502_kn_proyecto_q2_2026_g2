<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - CarpoolMatch CR</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-simple-body">

    <header class="header">
        <div class="brand">
            <h1>CarpoolMatch CR</h1>
            <p>Viajes compartidos en Costa Rica</p>
        </div>

        <nav class="nav">
            <a href="index.html">Inicio</a>
            <a href="login.html" class="nav-btn">Iniciar sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>

        <div id="usuarioHeader" class="usuario-header"></div>
    </header>

    <main class="login-simple">
        <section class="login-card">
            <h2>Iniciar sesión</h2>

            <p>
                Ingresa tus datos para acceder a la plataforma.
            </p>

            <form id="formLogin" class="form" action="php/login.php" method="POST">
                <label for="correoLogin">Correo electrónico</label>
                <input type="email" id="correoLogin" name="correo" placeholder="ejemplo@correo.com">

                <label for="passwordLogin">Contraseña</label>
                <input type="password" id="passwordLogin" name="password" placeholder="Ingrese su contraseña">

                <div class="form-row">
                    <label class="check">
                        <input type="checkbox" id="recordarSesion">
                        Recordar correo
                    </label>
                </div>

                <button type="submit" class="btn btn-primary full">
                    Ingresar
                </button>
            </form>

            <p id="mensajeLogin" class="message"></p>

            <p class="switch-text">
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate aquí</a>
            </p>
        </section>
    </main>

    <script>
        const parametrosLogin = new URLSearchParams(window.location.search);
        const mensajeLogin = document.getElementById("mensajeLogin");

        if (mensajeLogin) {
            const error = parametrosLogin.get("error");
            const registro = parametrosLogin.get("registro");

            if (registro === "ok") {
                mensajeLogin.textContent = "Usuario registrado correctamente. Ahora puede iniciar sesión.";
                mensajeLogin.style.color = "green";
            }

            if (error === "campos") {
                mensajeLogin.textContent = "Debe ingresar correo y contraseña.";
                mensajeLogin.style.color = "red";
            } else if (error === "credenciales") {
                mensajeLogin.textContent = "Correo o contraseña incorrectos.";
                mensajeLogin.style.color = "red";
            } else if (error === "inactivo") {
                mensajeLogin.textContent = "El usuario se encuentra inactivo.";
                mensajeLogin.style.color = "red";
            }
        }
    </script>

    <script src="js/app.js"></script>
</body>

</html>
